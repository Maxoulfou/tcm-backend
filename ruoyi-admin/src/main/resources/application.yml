# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.1
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: ${RUOYI_PROFILE:./runtime/uploadPath}

# TCM 自动备份配置。默认写入本地 runtime/uploadPath/backup，可通过环境变量开启 Backblaze B2。
tcm:
  r2:
    enabled: ${R2_ENABLED:false}
    endpoint: ${R2_ENDPOINT:https://a9fd0d0d89926fede42aee530ce2ace4.r2.cloudflarestorage.com}
    bucket: ${R2_BUCKET:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    object-prefix: ${R2_OBJECT_PREFIX:otcm-files/}
    backup-on-write: ${R2_BACKUP_ON_WRITE:true}
    restore-on-read: ${R2_RESTORE_ON_READ:true}
  backup:
    cron: ${TCM_BACKUP_CRON:0 0 2 * * ?}
    retention-days: ${TCM_BACKUP_RETENTION_DAYS:30}
    b2:
      enabled: ${B2_BACKUP_ENABLED:false}
      key-id: ${B2_KEY_ID:}
      application-key: ${B2_APPLICATION_KEY:}
      bucket-id: ${B2_BUCKET_ID:}
      file-prefix: ${B2_FILE_PREFIX:clinic-backup/}
      lifecycle-enabled: ${B2_LIFECYCLE_ENABLED:true}
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8006
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 200
    threads:
      # tomcat最大线程数，默认为200
      max: 200
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 20

public:
  # 对外邮件/公开表单默认使用的前端地址，可被 PUBLIC_APP_BASE_URL 环境变量覆盖
  app-base-url: ${PUBLIC_APP_BASE_URL:http://127.0.0.1:5173}

stripe:
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:pk_live_51MqHNDB0dRfEjqw9hTGNFagjRwwZM5i54pfw99rxteo33U5JE0HYEr3k9DpyRTCggwtwBwBgzb4mP2pPnSxcnmuE0078JSJiyZ}
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  terminal-reader-id: ${STRIPE_TERMINAL_READER_ID:tmr_FodNFg6R0NHBnT}

deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
  endpoint: ${DEEPSEEK_ENDPOINT:https://api.deepseek.com/chat/completions}

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 邮件配置
  mail:
    host: smtp.resend.com
    port: 465
    username: resend
    password: ${SPRING_MAIL_PASSWORD:}
    from: no-reply@mail.otcm.ca
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: ${SPRING_MAIL_CONNECTION_TIMEOUT:15000}
          timeout: ${SPRING_MAIL_TIMEOUT:60000}
          writetimeout: ${SPRING_MAIL_WRITE_TIMEOUT:60000}
          ssl:
            enable: true
            trust: smtp.resend.com
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: false
  # redis 配置
  redis:
    # 地址
    host: ${REDIS_HOST:127.0.0.1}
    # 端口，默认为6379
    port: ${REDIS_PORT:6379}
    # 数据库索引
    database: 0
    # 密码
    password: ${REDIS_PASSWORD:}
    # 连接超时时间
    timeout: 10s
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 0
        # 连接池中的最大空闲连接
        max-idle: 8
        # 连接池的最大数据库连接数
        max-active: 8
        # #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: ${RUOYI_TOKEN_SECRET:replace-this-token-secret-before-production}
  # 令牌有效期（分钟）
  expireTime: ${RUOYI_TOKEN_EXPIRE_MINUTES:1440}

file-access:
  base-url: ${FILE_ACCESS_BASE_URL:}
  ttl-seconds: ${FILE_ACCESS_TTL_SECONDS:2592000}

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Swagger配置
swagger:
  # 是否开启swagger
  enabled: false
  # 请求前缀
  pathMapping: /dev-api

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice,/api/*
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*,/api/*
